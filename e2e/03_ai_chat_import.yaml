# Leben - AI Chat Import Flow
# Tests: Open AI chat → send a message → verify response → import button visible
appId: com.leben.mobile
---
- launchApp
- tapOn: "Continue as Guest"
- tapOn:
    id: "tab-ai-chat"
- assertVisible: "Leben Neural"
- tapOn:
    id: "chat-input"
- inputText: "Suggest 3 tasks to improve my productivity"
- tapOn:
    id: "chat-send-button"
- waitForAnimationToEnd
- assertVisible:
    text: "Import"
    enabled: true
