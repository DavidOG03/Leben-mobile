# Leben - Sign Out Clears Session Flow
# Tests: Sign in → sign out → verify logout screen shown and chat cleared
appId: com.leben.mobile
---
- launchApp
- tapOn: "Sign In Again"
- assertVisible: "Sign In"
- tapOn:
    id: "tab-settings"
- assertVisible: "Sign Out"
- tapOn: "Sign Out"
- tapOn: "Sign Out"  # confirm in alert
- assertVisible: "See you soon"
- assertNotVisible: "Sign Out"
